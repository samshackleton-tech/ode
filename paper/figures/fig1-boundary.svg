<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" width="680" height="224">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="6" y="12" width="232" height="198" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="20" y="31" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="1.2">ALICE'S WORKSHOP</text>
  <text x="20" y="44" text-anchor="start" font-family="Palatino" font-size="8.5" font-weight="normal" font-style="italic" fill="#5B6470">Relied on for nothing in Bob's verdict</text>
  <rect x="20" y="58" width="92" height="40" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="66" y="75" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="normal" font-style="normal" fill="#1C1E21">Unified source</text>
  <text x="66" y="89" text-anchor="middle" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">program.ode</text>
  <rect x="132" y="58" width="92" height="40" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="178" y="75" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="normal" font-style="normal" fill="#1C1E21">Compiler &amp; prover</text>
  <text x="178" y="89" text-anchor="middle" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">ode pack</text>
  <line x1="112" y1="78" x2="130" y2="78" stroke="#5B6470" stroke-width="0.8" marker-end="url(#arr-slate)"/>
  <rect x="20" y="124" width="204" height="72" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.65" stroke-dasharray="2.5,2.5"/>
  <text x="32" y="141" text-anchor="start" font-family="Palatino" font-size="8.4" font-weight="normal" font-style="italic" fill="#5B6470">What may go wrong here:</text>
  <text x="32" y="156" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• Bugs in the compiler or prover</text>
  <text x="32" y="170" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• Clever optimizations or proof search</text>
  <text x="32" y="184" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• A hostile or mistaken author</text>
  <line x1="258" y1="8" x2="258" y2="214" stroke="#9E2A2B" stroke-width="0.75" stroke-dasharray="3,3"/>
  <text x="322" y="23" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="bold" font-style="normal" fill="#9E2A2B" letter-spacing="1.1">ARTIFACT BOUNDARY</text>
  <rect x="272" y="46" width="100" height="34" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.8"/>
  <text x="322" y="60" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#1C1E21">Binary  (.o)</text>
  <text x="322" y="72" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">bytes + .ode.ocl</text>
  <line x1="224" y1="68" x2="270" y2="63" stroke="#1C1E21" stroke-width="0.8" marker-end="url(#arr-ink)"/>
  <line x1="372" y1="63" x2="402" y2="68" stroke="#9E2A2B" stroke-width="0.85" marker-end="url(#arr-accent)"/>
  <rect x="272" y="98" width="100" height="34" rx="1.5" fill="#FFFFFF" stroke="#5B6470" stroke-width="0.75"/>
  <text x="322" y="112" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#1C1E21">Proof  (.proof)</text>
  <text x="322" y="124" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">separate certificate</text>
  <line x1="224" y1="86" x2="270" y2="115" stroke="#5B6470" stroke-width="0.75" marker-end="url(#arr-slate)"/>
  <line x1="372" y1="115" x2="402" y2="105" stroke="#5B6470" stroke-width="0.8" marker-end="url(#arr-slate)"/>
  <rect x="272" y="152" width="100" height="34" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75" stroke-dasharray="2.5,2.5"/>
  <text x="322" y="166" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">Glossary (.json)</text>
  <text x="322" y="178" text-anchor="middle" font-family="Palatino" font-size="7.4" font-weight="normal" font-style="italic" fill="#7D8590">optional; not hashed</text>
  <line x1="224" y1="93" x2="270" y2="168" stroke="#CFC9BC" stroke-width="0.7" stroke-dasharray="2.5,2.5" marker-end="url(#arr-slate)"/>
  <path d="M 372 178 L 384 178 L 384 205 L 603 205 L 603 198" fill="none" stroke="#5B6470" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2.5,2.5" marker-end="url(#arr-slate)"/>
  <rect x="392" y="12" width="282" height="202" rx="1.5" fill="#FBF2F1" stroke="#9E2A2B" stroke-width="0.95"/>
  <text x="406" y="31" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#9E2A2B" letter-spacing="1.1">BOB'S AUDIT  —  THE RELIANCE SET</text>
  <text x="406" y="44" text-anchor="start" font-family="Palatino" font-size="8.5" font-weight="normal" font-style="italic" fill="#5B6470">Every piece Bob relies on for his verdict</text>
  <rect x="406" y="58" width="116" height="62" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.85"/>
  <text x="464" y="75" text-anchor="middle" font-family="Palatino" font-size="9.2" font-weight="bold" font-style="normal" fill="#9E2A2B">Small Verifier</text>
  <text x="464" y="90" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="normal" font-style="normal" fill="#1C1E21">odeverify</text>
  <text x="464" y="104" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">checks machine bytes</text>
  <text x="464" y="114" text-anchor="middle" font-family="Menlo" font-size="6.9" font-weight="normal" font-style="normal" fill="#5B6470">against x86/arm64.tab</text>
  <line x1="522" y1="89" x2="544" y2="89" stroke="#9E2A2B" stroke-width="0.9" marker-end="url(#arr-accent)"/>
  <rect x="546" y="58" width="114" height="62" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.85"/>
  <text x="603" y="75" text-anchor="middle" font-family="Palatino" font-size="9.0" font-weight="bold" font-style="normal" fill="#1C1E21">Verdict &amp; Digest</text>
  <text x="603" y="91" text-anchor="middle" font-family="Menlo" font-size="8.8" font-weight="bold" font-style="normal" fill="#9E2A2B">shown</text>
  <text x="603" y="106" text-anchor="middle" font-family="Menlo" font-size="7.1" font-weight="normal" font-style="normal" fill="#5B6470">ode_&lt;52-char-b32&gt;</text>
  <rect x="406" y="134" width="116" height="62" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="464" y="151" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="normal" font-style="normal" fill="#1C1E21">Instruction Table</text>
  <text x="464" y="165" text-anchor="middle" font-family="Menlo" font-size="7.1" font-weight="normal" font-style="normal" fill="#5B6470">x86.tab (94 rows)</text>
  <text x="464" y="177" text-anchor="middle" font-family="Menlo" font-size="7.1" font-weight="normal" font-style="normal" fill="#5B6470">arm64.tab (54 rows)</text>
  <text x="464" y="190" text-anchor="middle" font-family="Palatino" font-size="7.5" font-weight="normal" font-style="italic" fill="#5B6470">silicon cross-checked</text>
  <line x1="464" y1="134" x2="464" y2="122" stroke="#5B6470" stroke-width="0.75" marker-end="url(#arr-slate)"/>
  <rect x="546" y="134" width="114" height="62" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.85"/>
  <text x="603" y="151" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="bold" font-style="normal" fill="#9E2A2B">Bob Reads Only</text>
  <text x="603" y="166" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="normal" font-style="normal" fill="#1C1E21">&lt;hash&gt;.ocl</text>
  <text x="603" y="180" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">nameless contract;</text>
  <text x="603" y="191" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">0 register names</text>
  <line x1="603" y1="120" x2="603" y2="132" stroke="#9E2A2B" stroke-width="0.8" marker-end="url(#arr-accent)"/>
</svg>
