  <line x1="368" y1="62" x2="390" y2="62" stroke="#1C1E21" stroke-width="0.9" marker-end="url(#arr-ink)"/>
  <rect x="260" y="96" width="108" height="40" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.8"/>
  <text x="314" y="113" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="normal" font-style="normal" fill="#1C1E21">Proof (.proof)</text>
  <text x="314" y="127" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">separate file</text>
  <line x1="218" y1="90" x2="258" y2="116" stroke="#1C1E21" stroke-width="0.85" marker-end="url(#arr-ink)"/>
  <line x1="368" y1="116" x2="390" y2="116" stroke="#1C1E21" stroke-width="0.9" marker-end="url(#arr-ink)"/>
  <rect x="260" y="152" width="108" height="40" rx="1.5" fill="#F7F5F0" stroke="#5B6470" stroke-width="0.75" stroke-dasharray="3,2.5"/>
  <text x="314" y="169" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">Glossary (.json)</text>
  <text x="314" y="183" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="italic" fill="#5B6470">optional display</text>
  <line x1="218" y1="98" x2="258" y2="172" stroke="#5B6470" stroke-width="0.75" stroke-dasharray="3,2.5" marker-end="url(#arr-slate)"/>
  <path d="M 368 172 L 380 172 L 380 212 L 605 212 L 605 204" fill="none" stroke="#5B6470" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,2.5" marker-end="url(#arr-slate)"/>
  <rect x="392" y="12" width="282" height="210" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="1.0"/>
  <text x="406" y="31" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.8">BOB'S AUDIT  —  THE RELIANCE SET</text>
  <text x="406" y="45" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="italic" fill="#5B6470">What Bob relies on for a valid verdict</text>
  <rect x="406" y="58" width="120" height="66" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.9"/>
  <text x="466" y="75" text-anchor="middle" font-family="Palatino" font-size="9.0" font-weight="bold" font-style="normal" fill="#1C1E21">Audit &amp; Verifier</text>
  <text x="466" y="90" text-anchor="middle" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">ode audit / odeverify</text>
  <text x="466" y="104" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">checks bytes, proof,</text>
  <text x="466" y="116" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">and expected ID</text>
  <line x1="526" y1="91" x2="546" y2="91" stroke="#9E2A2B" stroke-width="1.0" marker-end="url(#arr-accent)"/>
  <rect x="548" y="58" width="114" height="66" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.9"/>
  <text x="605" y="75" text-anchor="middle" font-family="Palatino" font-size="9.0" font-weight="bold" font-style="normal" fill="#1C1E21">Verdict</text>
  <text x="605" y="92" text-anchor="middle" font-family="Menlo" font-size="9.2" font-weight="bold" font-style="normal" fill="#9E2A2B">shown</text>
  <text x="605" y="106" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">for symbol</text>
  <text x="605" y="117" text-anchor="middle" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">ode_&lt;52-char-ID&gt;</text>
  <rect x="406" y="138" width="120" height="66" rx="1.5" fill="#FFFFFF" stroke="#5B6470" stroke-width="0.8"/>
  <text x="466" y="155" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="bold" font-style="normal" fill="#1C1E21">Instruction Tables</text>
  <text x="466" y="170" text-anchor="middle" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#1C1E21">x86.tab (109 rows)</text>
  <text x="466" y="183" text-anchor="middle" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#1C1E21">arm64.tab (67 rows)</text>
  <text x="466" y="197" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="italic" fill="#5B6470">CPU + model checked</text>
  <line x1="466" y1="138" x2="466" y2="126" stroke="#1C1E21" stroke-width="0.85" marker-end="url(#arr-ink)"/>
  <rect x="548" y="138" width="114" height="66" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.9"/>
  <text x="605" y="155" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="bold" font-style="normal" fill="#1C1E21">Expected Contract</text>
  <text x="605" y="170" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">&lt;52-char-ID&gt;.ocl</text>
  <text x="605" y="184" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">read by Bob;</text>
  <text x="605" y="196" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">hash checked</text>
  <line x1="605" y1="138" x2="605" y2="126" stroke="#1C1E21" stroke-width="0.85" marker-end="url(#arr-ink)"/>
</svg>
