      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
