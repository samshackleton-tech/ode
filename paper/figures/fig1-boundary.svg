  <rect x="6" y="12" width="224" height="210" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="18" y="31" text-anchor="start" font-family="Palatino" font-size="8.4" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="1.0">ALICE'S WORKSHOP</text>
  <text x="18" y="45" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="italic" fill="#5B6470">Errors here cannot forge a valid proof</text>
  <rect x="18" y="60" width="90" height="42" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="63" y="78" text-anchor="middle" font-family="Palatino" font-size="8.8" font-weight="bold" font-style="normal" fill="#1C1E21">Source</text>
  <text x="63" y="93" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">program.ode</text>
  <rect x="126" y="60" width="92" height="42" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="172" y="78" text-anchor="middle" font-family="Palatino" font-size="8.5" font-weight="bold" font-style="normal" fill="#1C1E21">Compile &amp; prove</text>
  <text x="172" y="93" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">ode pack</text>
  <line x1="108" y1="81" x2="124" y2="81" stroke="#5B6470" stroke-width="0.85" marker-end="url(#arr-slate)"/>
  <rect x="18" y="122" width="200" height="86" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.65" stroke-dasharray="2.5,2.5"/>
  <text x="28" y="140" text-anchor="start" font-family="Palatino" font-size="8.4" font-weight="bold" font-style="normal" fill="#1C1E21">Not in Bob's reliance set:</text>
  <text x="28" y="156" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• Compiler &amp; assembler bugs</text>
  <text x="28" y="171" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• Prover heuristics or search bugs</text>
  <text x="28" y="186" text-anchor="start" font-family="Palatino" font-size="8.3" font-weight="normal" font-style="normal" fill="#5B6470">• Hostile or mistaken author</text>
  <text x="28" y="201" text-anchor="start" font-family="Palatino" font-size="7.7" font-weight="normal" font-style="italic" fill="#7D8590">(cannot make verifier accept false code)</text>
  <line x1="248" y1="8" x2="248" y2="226" stroke="#5B6470" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="314" y="24" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.8">DELIVERED TO BOB</text>
  <rect x="260" y="42" width="108" height="40" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.9"/>
  <text x="314" y="59" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="bold" font-style="normal" fill="#1C1E21">Object (.o)</text>
  <text x="314" y="73" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">bytes + .ode.ocl</text>
