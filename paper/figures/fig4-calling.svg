<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" width="680" height="224">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="8" y="12" width="212" height="200" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.85"/>
  <text x="20" y="30" text-anchor="start" font-family="Palatino" font-size="7.9" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.7">A.  THE C CONVENTION</text>
  <text x="20" y="43" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">where external code calls in</text>
  <rect x="22" y="54" width="184" height="34" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="30" y="68" text-anchor="start" font-family="Palatino" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">save callee-saved regs (schematic)</text>
  <text x="30" y="81" text-anchor="start" font-family="Menlo" font-size="7.2" font-weight="normal" font-style="normal" fill="#5B6470">move args to rdi..r9 / x0..x7</text>
  <line x1="114" y1="88" x2="114" y2="104" stroke="#5B6470" stroke-width="0.85" marker-end="url(#arr-slate)"/>
  <rect x="32" y="106" width="164" height="34" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="0.8"/>
  <text x="114" y="120" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="bold" font-style="normal" fill="#1C1E21">call / bl  helper</text>
  <text x="114" y="133" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">callee saves its own used regs</text>
  <line x1="114" y1="140" x2="114" y2="154" stroke="#5B6470" stroke-width="0.85" marker-end="url(#arr-slate)"/>
  <rect x="22" y="156" width="184" height="28" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="114" y="173" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">restore saved regs  ·  ret</text>
  <text x="114" y="201" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="italic" fill="#5B6470">stack frame when saving link/regs</text>
  <rect x="234" y="12" width="212" height="200" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.85"/>
  <text x="246" y="30" text-anchor="start" font-family="Palatino" font-size="7.9" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.7">B.  PRIVATE CONVENTION</text>
  <text x="246" y="43" text-anchor="start" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="italic" fill="#5B6470">return address kept in x15 (AArch64)</text>
  <rect x="248" y="54" width="184" height="34" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="256" y="68" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">mov x15, x30   // keep link</text>
  <text x="256" y="81" text-anchor="start" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">live values stay in registers</text>
  <line x1="340" y1="88" x2="340" y2="104" stroke="#1C1E21" stroke-width="0.85" marker-end="url(#arr-ink)"/>
  <rect x="254" y="106" width="172" height="34" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="0.85"/>
  <text x="340" y="120" text-anchor="middle" font-family="Menlo" font-size="7.4" font-weight="bold" font-style="normal" fill="#1C1E21">bl  helper   (preserves x15)</text>
  <text x="340" y="133" text-anchor="middle" font-family="Menlo" font-size="7.2" font-weight="normal" font-style="normal" fill="#5B6470">in a=x9, b=x10  ·  out=x11</text>
  <line x1="340" y1="140" x2="340" y2="154" stroke="#1C1E21" stroke-width="0.85" marker-end="url(#arr-ink)"/>
  <rect x="248" y="156" width="184" height="28" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="340" y="173" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">mov x30, x15  ·  ret</text>
  <text x="340" y="201" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#1C1E21">zero stack frame</text>
  <rect x="460" y="12" width="212" height="200" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.85"/>
  <text x="472" y="30" text-anchor="start" font-family="Palatino" font-size="7.9" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.7">C.  A TAIL CALL  (jmp / b)</text>
  <text x="472" y="43" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">reuses the caller's return frame</text>
  <rect x="474" y="54" width="184" height="34" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="482" y="68" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">sp == entry sp  &amp;  x30 intact</text>
  <text x="482" y="81" text-anchor="start" font-family="Menlo" font-size="7.1" font-weight="normal" font-style="normal" fill="#5B6470">caller keeps ⊆ callee preserves</text>
  <line x1="566" y1="88" x2="566" y2="108" stroke="#9E2A2B" stroke-width="0.95" marker-end="url(#arr-accent)"/>
  <text x="574" y="102" text-anchor="start" font-family="Menlo" font-size="7.8" font-weight="bold" font-style="normal" fill="#9E2A2B">jmp / b</text>
  <rect x="480" y="110" width="172" height="40" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="0.85"/>
  <text x="566" y="126" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="bold" font-style="normal" fill="#1C1E21">callee entry point</text>
  <text x="566" y="141" text-anchor="middle" font-family="Palatino" font-size="7.7" font-weight="normal" font-style="normal" fill="#5B6470">returns directly to outer caller</text>
  <line x1="566" y1="150" x2="566" y2="174" stroke="#9E2A2B" stroke-width="0.9" marker-end="url(#arr-accent)"/>
  <text x="566" y="186" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="italic" fill="#1C1E21">outer caller receives result directly</text>
  <text x="566" y="201" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#1C1E21">no second call or return</text>
</svg>
