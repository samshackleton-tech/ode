<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" width="680" height="196">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="6" y="14" width="214" height="168" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="18" y="32" text-anchor="start" font-family="Palatino" font-size="7.8" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="1.0">AUTHORED CONTRACT  (.ode)</text>
  <text x="18" y="52" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#7D8590">// 1 if all bytes are zero</text>
  <text x="18" y="66" text-anchor="start" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#1C1E21">def zero_from(a, i) {</text>
  <text x="18" y="78" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">  if i == len(a) then 1</text>
  <text x="18" y="90" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">  else if a[i] != 0 then 0</text>
  <text x="18" y="102" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">  else zero_from(a, i + 1)</text>
  <text x="18" y="114" text-anchor="start" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <text x="18" y="130" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">fn all_zero(a: n bytes, n: number)</text>
  <text x="18" y="143" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">  returns zero_from(a, 0)</text>
  <text x="18" y="156" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">  trace depends on a, n</text>
  <text x="18" y="169" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#5B6470">  stack 0  { for x86_64 ... }</text>
  <line x1="220" y1="96" x2="286" y2="96" stroke="#9E2A2B" stroke-width="0.95" marker-end="url(#arr-accent)"/>
  <text x="253" y="86" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="bold" font-style="normal" fill="#9E2A2B">ode canon</text>
  <text x="253" y="110" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="italic" fill="#5B6470">strip comments</text>
  <text x="253" y="121" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="italic" fill="#5B6470">drop unused defs</text>
  <text x="253" y="132" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="italic" fill="#5B6470">number all slots</text>
  <rect x="286" y="14" width="222" height="116" rx="1.5" fill="#FBF2F1" stroke="#9E2A2B" stroke-width="0.9"/>
  <text x="298" y="31" text-anchor="start" font-family="Palatino" font-size="7.8" font-weight="bold" font-style="normal" fill="#9E2A2B" letter-spacing="1.0">CANONICAL CONTRACT  (.ocl)</text>
  <text x="298" y="48" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">def f1(p0, p1) {</text>
  <text x="298" y="60" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">  if p1 == len(p0) then 1 ...</text>
  <text x="298" y="72" text-anchor="start" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <text x="298" y="86" text-anchor="start" font-family="Menlo" font-size="7.0" font-weight="normal" font-style="normal" fill="#1C1E21">contract (a0: a1 bytes, a1: number) {</text>
  <text x="298" y="98" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">  returns f0(a0)</text>
  <text x="298" y="110" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">  trace depends on a0, a1</text>
  <text x="298" y="122" text-anchor="start" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">  stack 0 }</text>
  <rect x="286" y="140" width="222" height="42" rx="1.5" fill="#FFFFFF" stroke="#CFC9BC" stroke-width="0.75" stroke-dasharray="2.5,2.5"/>
  <text x="298" y="155" text-anchor="start" font-family="Palatino" font-size="7.3" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.8">PERSONAL GLOSSARY  (never hashed)</text>
  <text x="298" y="171" text-anchor="start" font-family="Menlo" font-size="7.2" font-weight="normal" font-style="normal" fill="#5B6470">{ a0: "a", a1: "n", f0: "all_zero" }</text>
  <line x1="508" y1="72" x2="532" y2="72" stroke="#9E2A2B" stroke-width="0.95" marker-end="url(#arr-accent)"/>
  <rect x="536" y="14" width="138" height="116" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.9"/>
  <text x="604" y="32" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#9E2A2B" letter-spacing="1.0">BLAKE3-256</text>
  <text x="604" y="46" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="italic" fill="#5B6470">52-char base-32 digest</text>
  <text x="604" y="65" text-anchor="middle" font-family="Menlo" font-size="7.2" font-weight="bold" font-style="normal" fill="#9E2A2B">jbqyjqpese4s4cq35q</text>
  <text x="604" y="76" text-anchor="middle" font-family="Menlo" font-size="7.2" font-weight="bold" font-style="normal" fill="#9E2A2B">xlhaevjvzuaqznquqw</text>
  <text x="604" y="87" text-anchor="middle" font-family="Menlo" font-size="7.2" font-weight="bold" font-style="normal" fill="#9E2A2B">6mtlaqleluc25ika</text>
  <line x1="548" y1="97" x2="660" y2="97" stroke="#CFC9BC" stroke-width="0.6"/>
  <text x="604" y="111" text-anchor="middle" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">Symbol: ode_&lt;52&gt;</text>
  <text x="604" y="123" text-anchor="middle" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">File:   &lt;52&gt;.ocl</text>
  <text x="604" y="156" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">Same contract on x86-64</text>
  <text x="604" y="168" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">and AArch64 → same hash</text>
</svg>
