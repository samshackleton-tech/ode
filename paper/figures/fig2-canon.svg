<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="6" y="12" width="204" height="208" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="16" y="30" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.7">AS THE AUTHOR WROTE IT  (.ode)</text>
  <text x="16.0" y="48.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#7D8590">// 1 if every byte of a is zero, else 0.</text>
  <text x="16.0" y="69.6" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">def zero_from(a, at) {</text>
  <text x="34.06" y="80.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">if at == len(a) then 1</text>
  <text x="34.06" y="91.2" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">else if a[at] != 0 then 0</text>
  <text x="34.06" y="102.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">else zero_from(a, at + 1)</text>
  <text x="16.0" y="112.80000000000001" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <text x="16.0" y="134.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">def zeros(a) { zero_from(a, 0) }</text>
  <text x="16.0" y="156.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">fn all_zero(a: n bytes, n: number)</text>
  <text x="34.06" y="166.8" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">returns zeros(a)</text>
  <text x="34.06" y="177.60000000000002" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">trace depends on a, n</text>
  <text x="34.06" y="188.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">stack 0</text>
  <line x1="210" y1="110" x2="268" y2="110" stroke="#9E2A2B" stroke-width="1.0" marker-end="url(#arr-accent)"/>
  <text x="239" y="100" text-anchor="middle" font-family="Menlo" font-size="8.4" font-weight="bold" font-style="normal" fill="#9E2A2B">ode canon</text>
  <text x="239" y="126" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">leaves out</text>
  <text x="239" y="137" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">comments;</text>
  <text x="239" y="152" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">numbers</text>
  <text x="239" y="163" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">every name</text>
  <rect x="270" y="12" width="214" height="208" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="0.95"/>
  <text x="280" y="30" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.7">THE CANONICAL CONTRACT  (.ocl)</text>
  <text x="280.0" y="48.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">def f1(p0, p1) {</text>
  <text x="298.06" y="58.8" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">if p1 == len(p0) then 1</text>
  <text x="298.06" y="69.6" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">else if p0[p1] != 0 then 0</text>
  <text x="298.06" y="80.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">else f1(p0, p1 + 1)</text>
  <text x="280.0" y="91.2" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <text x="280.0" y="112.80000000000001" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">def f0(p0) {</text>
  <text x="298.06" y="123.60000000000001" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">f1(p0, 0)</text>
  <text x="280.0" y="134.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <text x="280.0" y="156.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">contract (a0: a1 bytes, a1: number) {</text>
  <text x="298.06" y="166.8" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">returns f0(a0)</text>
  <text x="298.06" y="177.60000000000002" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">trace depends on a0, a1</text>
  <text x="298.06" y="188.4" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">stack 0</text>
  <text x="280.0" y="199.20000000000002" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">}</text>
  <line x1="484" y1="62" x2="502" y2="62" stroke="#9E2A2B" stroke-width="1.0" marker-end="url(#arr-accent)"/>
  <rect x="504" y="12" width="170" height="114" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.95"/>
  <text x="589" y="30" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#1C1E21" letter-spacing="0.7">BLAKE3 OF THAT TEXT</text>
  <text x="589" y="43" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">256 bits as 52 characters</text>
  <text x="589" y="61" text-anchor="middle" font-family="Menlo" font-size="7.7" font-weight="bold" font-style="normal" fill="#1C1E21">jbqyjqpese4s4cq35q</text>
  <text x="589" y="73" text-anchor="middle" font-family="Menlo" font-size="7.7" font-weight="bold" font-style="normal" fill="#1C1E21">xlhaevjvzuaqznquqw</text>
  <text x="589" y="85" text-anchor="middle" font-family="Menlo" font-size="7.7" font-weight="bold" font-style="normal" fill="#1C1E21">6mtlaqleluc25ika</text>
  <line x1="516" y1="94" x2="662" y2="94" stroke="#CFC9BC" stroke-width="0.6"/>
  <text x="589" y="107" text-anchor="middle" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">symbol  ode_&lt;these 52&gt;</text>
  <text x="589" y="119" text-anchor="middle" font-family="Menlo" font-size="7.4" font-weight="normal" font-style="normal" fill="#1C1E21">file    &lt;these 52&gt;.ocl</text>
  <rect x="504" y="136" width="170" height="84" rx="1.5" fill="#FFFFFF" stroke="#5B6470" stroke-width="0.75" stroke-dasharray="3,2.5"/>
  <text x="516" y="152" text-anchor="start" font-family="Palatino" font-size="7.5" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.4">OPTIONAL DISPLAY GLOSSARY</text>
  <text x="516" y="168.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">a0  =  a</text>
  <text x="516" y="179.5" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">a1  =  n</text>
  <text x="516" y="191.0" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">f0  =  zeros</text>
  <text x="516" y="202.5" text-anchor="start" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">f1  =  zero_from</text>
</svg>
