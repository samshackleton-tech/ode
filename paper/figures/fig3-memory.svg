<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="16" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.9">CALLER'S MEMORY PIECES  (pairwise disjoint: no_overlap)</text>
  <rect x="10" y="44" width="132" height="46" rx="1.5" fill="#F7F5F0" stroke="#5B6470" stroke-width="0.8"/>
  <text x="76" y="63" text-anchor="middle" font-family="Menlo" font-size="8.6" font-weight="bold" font-style="normal" fill="#1C1E21">input</text>
  <text x="76" y="77" text-anchor="middle" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="normal" fill="#5B6470">len bytes · read-only</text>
  <text x="158" y="70" text-anchor="middle" font-family="Palatino" font-size="11" font-weight="normal" font-style="normal" fill="#7D8590">⊥</text>
  <text x="312" y="36" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#1C1E21">nd : node120  (120 bytes · read/write)</text>
  <rect x="174" y="44" width="276" height="46" rx="1.5" fill="#FFFFFF" stroke="#1C1E21" stroke-width="0.9"/>
  <rect x="174" y="44" width="62" height="46" rx="1.5" fill="#F7F5F0" stroke="#1C1E21" stroke-width="0.65"/>
  <text x="205" y="63" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="normal" font-style="normal" fill="#1C1E21">nd.h</text>
  <text x="205" y="77" text-anchor="middle" font-family="Menlo" font-size="7.0" font-weight="normal" font-style="normal" fill="#5B6470">0..32</text>
  <rect x="236" y="44" width="134" height="46" rx="1.5" fill="#FBF2F1" stroke="#9E2A2B" stroke-width="1.0"/>
  <text x="303" y="63" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="bold" font-style="normal" fill="#9E2A2B">nd.block  (64 B)</text>
  <text x="303" y="77" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#9E2A2B">32..96 · lent read/write</text>
  <rect x="370" y="44" width="80" height="46" rx="1.5" fill="#F7F5F0" stroke="#1C1E21" stroke-width="0.65"/>
  <text x="410" y="63" text-anchor="middle" font-family="Menlo" font-size="7.6" font-weight="normal" font-style="normal" fill="#1C1E21">t, blen, flg</text>
  <text x="410" y="77" text-anchor="middle" font-family="Menlo" font-size="7.0" font-weight="normal" font-style="normal" fill="#5B6470">96..120</text>
  <text x="466" y="70" text-anchor="middle" font-family="Palatino" font-size="11" font-weight="normal" font-style="normal" fill="#7D8590">⊥</text>
  <rect x="482" y="44" width="92" height="46" rx="1.5" fill="#F7F5F0" stroke="#5B6470" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="528" y="63" text-anchor="middle" font-family="Menlo" font-size="8.3" font-weight="normal" font-style="normal" fill="#1C1E21">stack</text>
  <text x="528" y="77" text-anchor="middle" font-family="Palatino" font-size="7.6" font-weight="normal" font-style="normal" fill="#5B6470">call-local only</text>
  <text x="586" y="70" text-anchor="middle" font-family="Palatino" font-size="11" font-weight="normal" font-style="normal" fill="#7D8590">⊥</text>
  <rect x="598" y="44" width="74" height="46" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="635" y="63" text-anchor="middle" font-family="Menlo" font-size="8.0" font-weight="normal" font-style="normal" fill="#5B6470">.rodata</text>
  <text x="635" y="77" text-anchor="middle" font-family="Palatino" font-size="7.2" font-weight="normal" font-style="normal" fill="#7D8590">program const</text>
  <path d="M 76 90 C 76 122, 165 116, 185 138" fill="none" stroke="#5B6470" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-slate)"/>
  <text x="18" y="128" text-anchor="start" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="italic" fill="#5B6470">lent read-only as src</text>
  <path d="M 303 90 L 303 136" fill="none" stroke="#9E2A2B" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-accent)"/>
  <text x="311" y="118" text-anchor="start" font-family="Palatino" font-size="7.8" font-weight="normal" font-style="italic" fill="#9E2A2B">sub-span lent read/write as block</text>
  <rect x="144" y="140" width="260" height="58" rx="1.5" fill="#FFFFFF" stroke="#9E2A2B" stroke-width="0.9"/>
  <text x="274" y="158" text-anchor="middle" font-family="Menlo" font-size="8.1" font-weight="bold" font-style="normal" fill="#1C1E21">Callee:  b3l_pad_fast(block, src, n)</text>
  <text x="274" y="173" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#9E2A2B">ensures block = padded(src)  ·  stack 0</text>
  <text x="274" y="188" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="italic" fill="#5B6470">Cannot read or touch nd.h, t, blen, flags, or caller stack</text>
  <rect x="430" y="140" width="242" height="58" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.75"/>
  <text x="442" y="158" text-anchor="start" font-family="Palatino" font-size="8.4" font-weight="bold" font-style="normal" fill="#1C1E21">What stays proven on return:</text>
  <text x="442" y="173" text-anchor="start" font-family="Palatino" font-size="8.1" font-weight="normal" font-style="normal" fill="#9E2A2B">• nd.block now satisfies padded(src)</text>
  <text x="442" y="187" text-anchor="start" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="normal" fill="#5B6470">• Other pieces (nd.h, t, blen, flags) keep entry values</text>
</svg>
