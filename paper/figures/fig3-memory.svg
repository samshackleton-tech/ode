<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 224" width="680" height="224">
  <defs>
    <marker id="arr-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#1C1E21" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#5B6470" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1,1.3 L7,4 L1,6.7" fill="none" stroke="#9E2A2B" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="10" y="16" text-anchor="start" font-family="Palatino" font-size="8.2" font-weight="bold" font-style="normal" fill="#5B6470" letter-spacing="0.7">THE CALLER'S PIECES OF MEMORY  (no two of them overlap)</text>
  <rect x="10" y="46" width="126" height="48" rx="1.5" fill="#F7F5F0" stroke="#5B6470" stroke-width="0.85"/>
  <text x="73" y="66" text-anchor="middle" font-family="Menlo" font-size="8.8" font-weight="bold" font-style="normal" fill="#1C1E21">input</text>
  <text x="73" y="81" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="normal" fill="#5B6470">len bytes · read-only</text>
  <text x="154" y="72" text-anchor="middle" font-family="Palatino" font-size="7.2" font-weight="normal" font-style="italic" fill="#7D8590">disjoint</text>
  <text x="312" y="36" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#1C1E21">nd : node120  (one record of 120 bytes)</text>
  <rect x="172" y="46" width="280" height="48" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="1.0"/>
  <rect x="174" y="48" width="54" height="44" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.65"/>
  <text x="201" y="67" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="normal" font-style="normal" fill="#1C1E21">nd.h</text>
  <text x="201" y="81" text-anchor="middle" font-family="Menlo" font-size="7.5" font-weight="normal" font-style="normal" fill="#5B6470">[0, 32)</text>
  <rect x="231" y="48" width="122" height="44" rx="1.5" fill="#EEEBE2" stroke="#2E343D" stroke-width="0.95"/>
  <text x="292" y="67" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="bold" font-style="normal" fill="#1C1E21">nd.block</text>
  <text x="292" y="81" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#9E2A2B">[32, 96) · lent</text>
  <rect x="356" y="48" width="94" height="44" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.65"/>
  <text x="403" y="67" text-anchor="middle" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#1C1E21">counter, length,</text>
  <text x="403" y="81" text-anchor="middle" font-family="Menlo" font-size="7.3" font-weight="normal" font-style="normal" fill="#5B6470">flags · [96, 120)</text>
  <text x="468" y="72" text-anchor="middle" font-family="Palatino" font-size="7.2" font-weight="normal" font-style="italic" fill="#7D8590">disjoint</text>
  <rect x="484" y="46" width="90" height="48" rx="1.5" fill="#F7F5F0" stroke="#5B6470" stroke-width="0.85" stroke-dasharray="3,2"/>
  <text x="529" y="66" text-anchor="middle" font-family="Menlo" font-size="8.5" font-weight="normal" font-style="normal" fill="#1C1E21">stack</text>
  <text x="529" y="81" text-anchor="middle" font-family="Palatino" font-size="7.9" font-weight="normal" font-style="normal" fill="#5B6470">call-local</text>
  <rect x="596" y="46" width="76" height="48" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.8"/>
  <text x="634" y="66" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="normal" font-style="normal" fill="#5B6470">.rodata</text>
  <text x="634" y="81" text-anchor="middle" font-family="Palatino" font-size="7.7" font-weight="normal" font-style="normal" fill="#5B6470">const data</text>
  <path d="M 73 94 C 73 126, 165 120, 185 144" fill="none" stroke="#5B6470" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-slate)"/>
  <text x="14" y="132" text-anchor="start" font-family="Palatino" font-size="8.1" font-weight="normal" font-style="italic" fill="#5B6470">lent read-only as src</text>
  <path d="M 292 94 L 292 142" fill="none" stroke="#9E2A2B" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-accent)"/>
  <text x="300" y="124" text-anchor="start" font-family="Palatino" font-size="8.1" font-weight="normal" font-style="italic" fill="#9E2A2B">a part of nd, lent to read and write, as block</text>
  <rect x="142" y="146" width="266" height="62" rx="1.5" fill="#FFFFFF" stroke="#2E343D" stroke-width="0.95"/>
  <text x="275" y="164" text-anchor="middle" font-family="Menlo" font-size="8.2" font-weight="bold" font-style="normal" fill="#1C1E21">Callee:  pad_block(block, src, n)</text>
  <text x="275" y="180" text-anchor="middle" font-family="Menlo" font-size="7.8" font-weight="normal" font-style="normal" fill="#9E2A2B">ensures block = padded(src)  ·  stack 0</text>
  <text x="275" y="196" text-anchor="middle" font-family="Palatino" font-size="8.0" font-weight="normal" font-style="italic" fill="#5B6470">This call touches nothing else of nd or the stack</text>
  <rect x="424" y="146" width="248" height="62" rx="1.5" fill="#F7F5F0" stroke="#CFC9BC" stroke-width="0.8"/>
  <text x="436" y="164" text-anchor="start" font-family="Palatino" font-size="8.5" font-weight="bold" font-style="normal" fill="#1C1E21">What the caller knows after the call:</text>
  <text x="436" y="180" text-anchor="start" font-family="Palatino" font-size="8.2" font-weight="normal" font-style="normal" fill="#9E2A2B">• nd.block is padded(src)</text>
  <text x="436" y="196" text-anchor="start" font-family="Palatino" font-size="8.2" font-weight="normal" font-style="normal" fill="#5B6470">• nd.h, counter, length, flags are as they were</text>
</svg>
