name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native toolchains (clang, llvm, binutils-aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set up PyPy 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "pypy-3.11"

      - name: Install pytest and pytest-xdist
        run: python -m pip install --upgrade pip pytest pytest-xdist

      - name: Cache Lean toolchain and Lake build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            proof-core/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('proof-core/lean-toolchain', 'proof-core/lakefile.lean') }}-${{ hashFiles('proof-core/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('proof-core/lean-toolchain', 'proof-core/lakefile.lean') }}-
            lean-${{ runner.os }}-

      - name: Install Lean (elan)
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain "$(cat proof-core/lean-toolchain)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run full Ode test suite
        run: ./run-tests.sh --durations=25 --tb=short -q
